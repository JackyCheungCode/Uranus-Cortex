name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=true
      - name: Export generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Carbon usage guardrail
        run: npm run carbon:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run
      - name: Dependency audit
        run: npm audit --audit-level=high
